spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      connect-timeout: 3000ms
      lettuce:
        pool:
          enabled: true
          min-idle: 2
          max-idle: 8
          max-active: 16
          max-wait: 3000ms
        shutdown-timeout: 200ms
