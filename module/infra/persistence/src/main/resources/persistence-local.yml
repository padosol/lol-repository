spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
  # riot 스키마만 쓴다 — 이 레포의 마이그레이션 체인, history 는 riot.flyway_schema_history
  flyway:
    enabled: true
    locations: classpath:db/migration/riot
    schemas: riot
    default-schema: riot
  datasource:
    # currentSchema: JPA·native query·JdbcTemplate·Spring Batch 의 스키마 미지정 SQL 이 riot 만 본다
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=riot&reWriteBatchedInserts=true&tcpKeepAlive=true
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}
      leak-detection-threshold: ${DB_POOL_LEAK_THRESHOLD:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1500000}
      keepalive-time: ${DB_POOL_KEEPALIVE:300000}
