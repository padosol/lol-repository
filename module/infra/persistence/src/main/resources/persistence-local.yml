spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 스키마 이동(public → riot) 후에도 history 를 public 에서 찾게 고정한다. 미지정이면 riot 에
    # history 를 새로 만들고 V2 부터 재적용해 기동이 실패한다. riot 체인 분리 때 riot 으로 바꾼다
    default-schema: public
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?reWriteBatchedInserts=true&tcpKeepAlive=true
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}
      leak-detection-threshold: ${DB_POOL_LEAK_THRESHOLD:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1500000}
      keepalive-time: ${DB_POOL_KEEPALIVE:300000}
