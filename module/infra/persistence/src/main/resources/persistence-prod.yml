spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        generate_statistics: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 스키마 이동(public → riot) 후에도 history 를 public 에서 찾게 고정한다. 미지정이면 riot 에
    # history 를 새로 만들고 V2 부터 재적용해 기동이 실패한다. riot 체인 분리 때 riot 으로 바꾼다
    default-schema: public
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?reWriteBatchedInserts=true&tcpKeepAlive=true
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      leak-detection-threshold: 300000
      max-lifetime: 1500000
      keepalive-time: 300000
