dependencies {
    implementation project(':module:domain:summoner')
    implementation project(':module:domain:match')
    implementation project(':module:domain:league')
    implementation project(':module:domain:gamedata')
    implementation project(':module:domain:spectator')   // SpectatorTargetPort (관전 대상 소환사)
    implementation project(':module:shared')
    implementation project(':module:common')   // PageResult (공개 조회 API 페이지)
    implementation project(':module:infra:redis')

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Jackson (캐시 직렬화)
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    runtimeOnly 'org.postgresql:postgresql'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.postgresql:postgresql'
}
