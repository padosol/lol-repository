dependencies {
    implementation project(':module:domain:match')
    implementation project(':module:domain:gamedata')
    implementation project(':module:domain:champion')
    implementation project(':module:domain:summoner')
    implementation project(':module:domain:spectator')
    implementation project(':module:shared')

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.redisson:redisson-spring-boot-starter:3.46.0'

    // Jackson (match write-through 캐시 JSON 직렬화)
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Metrics
    implementation 'io.micrometer:micrometer-core'

    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}
