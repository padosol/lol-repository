# 내부 API(/internal/v1/**) OpenAPI 계약 — InternalApiDocsConfig 가 읽는다 (application.yml 로 덮어쓸 수 있다)
# /internal 아래에 둬야 내부 포트에서만 응답한다 (PublicApiPathFilter)
springdoc.api-docs.path=/internal/v1/api-docs
springdoc.paths-to-match=/internal/v1/**
# @ControllerAdvice 응답을 모든 operation 에 붙이지 않는다 — 응답은 컨트롤러 @ApiResponse 로만
springdoc.override-with-generic-response=false
# 계약 파일과 문자열 비교하므로 키 순서를 고정한다
springdoc.writer-with-order-by-keys=true
