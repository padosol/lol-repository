dependencies {
    implementation project(':module:domain:summoner')
    implementation project(':module:domain:match')
    implementation project(':module:domain:spectator')
    implementation project(':module:domain:champion')
    implementation project(':module:domain:league')
    implementation project(':module:shared')
    implementation project(':module:common')
    implementation project(':module:infra:redis')

    // Web & AOP
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Metrics (RiotCallRecorder·한도 관리자 지표)
    implementation 'io.micrometer:micrometer-core'

    // Redisson (for rate limiting)
    implementation 'org.redisson:redisson-spring-boot-starter:3.46.0'

    // WireMock (RiotApiService·한도 인수 테스트용)
    testImplementation 'org.wiremock:wiremock-standalone:3.9.2'

    // Testcontainers Redis (RedisRiotRateLimiter 테스트용)
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
}
