// module:domain:match - 매치/타임라인 컨텍스트 (도메인 + application port.in/out + readmodel)
dependencies {
    implementation project(':module:shared')
    implementation project(':module:domain:league')   // SaveMatchDataUseCase 가 league port.in/model 참조

    // Spring
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-tx'

    // Jackson (ReadModel DTO 어노테이션)
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Logging
    implementation 'org.slf4j:slf4j-api'

    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}
