spring:
  config:
    import:
      - api-prod.yml
      - persistence-prod.yml
      - rabbitmq-prod.yml
      - redis-prod.yml
      - riot-prod.yml
      - bigquery-prod.yml
  main:
    banner-mode: off  # stdout 을 JSON 로그만으로 유지

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: lol-repository

lol:
  backfill:
    range:
      start-id: ${BACKFILL_START_ID}
      end-id: ${BACKFILL_END_ID}
    chunk:
      size: ${BACKFILL_CHUNK_SIZE}
      parallelism: ${BACKFILL_PARALLELISM}
      fetch-size: ${BACKFILL_FETCH_SIZE}
    filter:
      season: ${BACKFILL_SEASON}
      queue-ids: ${BACKFILL_QUEUE_IDS}
    gcs:
      bucket: ${BACKFILL_GCS_BUCKET}
