spring:
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

lol:
  vt:
    executors:
      enabled: true
  stats-export:
    scheduler:
      enabled: ${LOL_STATS_EXPORT_SCHEDULER_ENABLED:false}
    cron: "0 20 */2 * * *"
    patch-count: 1
    queue-ids: [420]
    seed-id: 0
    chunk:
      size: 50000
      parallelism: 2
    bq-location: ${BIGQUERY_LOCATION:}
