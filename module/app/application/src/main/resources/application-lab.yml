# 로컬 Riot API 실험실: --spring.profiles.active=local,lab. 가짜 Riot 서버(tools/riot-mock)와 격리된 DB·Redis·MQ 를 쓴다.
# LabIsolationGuard 가 아래 값이 실제로 적용됐는지 기동 때 검사한다.
spring:
  datasource:
    # DB 이름만 lol_lab 으로 고정(.env 의 DB_NAME 무시). 호스트·포트·쿼리는 persistence-local.yml 과 같다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/lol_lab?currentSchema=riot&reWriteBatchedInserts=true&tcpKeepAlive=true
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  data:
    redis:
      database: 1
  rabbitmq:
    virtual-host: lab

riot:
  api-key: lab-key
  mock:
    base-url: ${RIOT_MOCK_BASE_URL:http://localhost:8099}
  rate-limit:
    # 가짜 Riot 서버(tools/riot-mock) 한도와 같게 둔다
    app-limits: "500:10"
    method-limits:
      "[account-v1.by-riot-id]": "1000:60"
      "[account-v1.by-puuid]": "1000:60"
      "[summoner-v4.by-puuid]": "1600:60"
      "[league-v4.entries-by-puuid]": "20000:10"
      "[match-v5.ids-by-puuid]": "2000:10"
      "[match-v5.match]": "2000:10"
      "[match-v5.timeline]": "2000:10"

management:
  info:
    env:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        lol.renewal.duration: true

info:
  lab: true
