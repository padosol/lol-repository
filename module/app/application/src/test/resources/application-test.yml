spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///test?currentSchema=riot
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # 운영 설정(persistence-*.yml)과 같다 — riot 스키마만
  flyway:
    enabled: true
    locations: classpath:db/migration/riot
    schemas: riot
    default-schema: riot
