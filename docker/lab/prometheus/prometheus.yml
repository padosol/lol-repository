global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: lol-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8111"]
  - job_name: riot-mock
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["riot-mock:8099"]
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
