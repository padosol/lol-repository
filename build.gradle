plugins {
    id 'java'
    id 'java-library'
    id 'org.springframework.boot' version '4.1.0' apply(false)
    id 'io.spring.dependency-management' version '1.1.7' apply(false)
}

allprojects {
    group = 'lol.mmrtr'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {

    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'checkstyle'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.getByName("bootJar") {
        enabled = false
    }

    tasks.getByName("jar") {
        enabled = true
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        // configuration-processor
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    checkstyle {
        toolVersion = '10.21.4'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        configProperties = ['suppressionFile': rootProject.file('config/checkstyle/suppressions.xml')]
        maxWarnings = 0
    }

    tasks.named('checkstyleTest') {
        enabled = false
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-parameters']
    }

    bootRun {
        String activeProfile = System.properties['spring.profiles.active']
        if (activeProfile != null) {
            systemProperty "spring.profiles.active", activeProfile
        }

        // 루트 .env 를 읽어 bootRun 프로세스 환경변수로 주입
        def envFile = rootProject.file('.env')
        if (envFile.exists()) {
            envFile.readLines('UTF-8').each { line ->
                def t = line.trim()
                if (t.isEmpty() || t.startsWith('#')) return
                if (t.startsWith('export ')) t = t.substring(7).trim()
                int i = t.indexOf('=')
                if (i <= 0) return
                def key = t.substring(0, i).trim()
                def value = t.substring(i + 1).trim()
                if ((value.startsWith('"') && value.endsWith('"')) ||
                    (value.startsWith("'") && value.endsWith("'"))) {
                    value = value.substring(1, value.length() - 1)
                }
                environment key, value
            }
        }
    }

}

// 수직 도메인 모듈의 컨텍스트 경계(ArchUnit) 테스트만 모아 실행
tasks.register('archTest') {
    group = 'verification'
    description = '수직 도메인 모듈의 ArchUnit 경계 테스트(*ArchitectureTest) 실행'
    dependsOn(['league', 'champion', 'spectator', 'match', 'summoner']
            .collect { ":module:domain:${it}:test" })
}
