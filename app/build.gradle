bootJar.enabled = true
jar.enabled = false

dependencies {
    // ── 수직 도메인 모듈 (컴포지션 루트가 전 컨텍스트 조립) ──
    implementation project(':module:domain:league')
    implementation project(':module:domain:champion')
    implementation project(':module:domain:spectator')
    implementation project(':module:domain:match')
    implementation project(':module:domain:summoner')
    implementation project(':module:shared')
    implementation project(':module:common')
    implementation project(':module:support:logging')
    implementation project(':infra:api')
    implementation project(':infra:persistence')
    implementation project(':infra:redis')
    implementation project(':infra:rabbitmq')
    implementation project(':infra:riot-client')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.batch:spring-batch-integration'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Redisson (dedicated backfill rate limiter)
    implementation 'org.redisson:redisson-spring-boot-starter:3.46.0'

    // Google Cloud Storage (match_participant_build backfill: NDJSON export → GCS)
    implementation platform('com.google.cloud:libraries-bom:26.43.0')
    implementation 'com.google.cloud:google-cloud-storage'
}
